<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Tasklytics web application security assessment — conceptual illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Window -->
  <rect x="80" y="70" width="1040" height="460" rx="16" fill="#0f1526" stroke="#38bdf8" stroke-opacity="0.18"/>
  <rect x="80" y="70" width="1040" height="52" rx="16" fill="#141c33"/>
  <circle cx="112" cy="96" r="7" fill="#f87171"/><circle cx="138" cy="96" r="7" fill="#fbbf24"/><circle cx="164" cy="96" r="7" fill="#34d399"/>
  <rect x="210" y="83" width="520" height="26" rx="13" fill="#0a0e1c"/>
  <text x="232" y="101" font-family="monospace" font-size="15" fill="#8a99b3">https://tasklytics.app · security assessment</text>

  <!-- Left: request -->
  <rect x="112" y="150" width="440" height="350" rx="12" fill="#0a0e1c" stroke="#38bdf8" stroke-opacity="0.12"/>
  <text x="134" y="182" font-family="monospace" font-size="15" fill="#22d3ee">REQUEST</text>
  <text x="134" y="220" font-family="monospace" font-size="16" fill="#e6edf6">GET /api/tasks</text>
  <text x="134" y="248" font-family="monospace" font-size="14" fill="#8a99b3">Host: tasklytics.app</text>
  <text x="134" y="274" font-family="monospace" font-size="14" fill="#8a99b3">Authorization: Bearer</text>
  <rect x="134" y="288" width="390" height="30" rx="6" fill="#141c33"/>
  <text x="146" y="308" font-family="monospace" font-size="13" fill="#38bdf8">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…</text>
  <text x="134" y="352" font-family="monospace" font-size="14" fill="#8a99b3">Cookie: session=…</text>
  <rect x="134" y="372" width="120" height="30" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="150" y="392" font-family="monospace" font-size="13" fill="#22d3ee">JWT analysis</text>

  <!-- Right: findings -->
  <rect x="588" y="150" width="488" height="350" rx="12" fill="#0a0e1c" stroke="#38bdf8" stroke-opacity="0.12"/>
  <text x="610" y="182" font-family="monospace" font-size="15" fill="#22d3ee">FINDINGS</text>

  <g font-family="sans-serif">
    <rect x="610" y="200" width="444" height="54" rx="8" fill="#141c33"/>
    <rect x="624" y="216" width="56" height="22" rx="11" fill="#f87171" fill-opacity="0.2"/>
    <text x="634" y="231" font-size="12" fill="#fca5a5" font-weight="700">HIGH</text>
    <text x="696" y="232" font-size="15" fill="#e6edf6">Broken access control on API</text>

    <rect x="610" y="266" width="444" height="54" rx="8" fill="#141c33"/>
    <rect x="624" y="282" width="56" height="22" rx="11" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="636" y="297" font-size="12" fill="#fcd34d" font-weight="700">MED</text>
    <text x="696" y="298" font-size="15" fill="#e6edf6">Weak JWT validation</text>

    <rect x="610" y="332" width="444" height="54" rx="8" fill="#141c33"/>
    <rect x="624" y="348" width="56" height="22" rx="11" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="636" y="363" font-size="12" fill="#fcd34d" font-weight="700">MED</text>
    <text x="696" y="364" font-size="15" fill="#e6edf6">Session fixation risk</text>

    <rect x="610" y="398" width="444" height="54" rx="8" fill="#141c33"/>
    <rect x="624" y="414" width="56" height="22" rx="11" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="636" y="429" font-size="12" fill="#7dd3fc" font-weight="700">LOW</text>
    <text x="696" y="430" font-size="15" fill="#e6edf6">Verbose error messages</text>
  </g>

  <!-- Concept label -->
  <rect x="884" y="486" width="200" height="28" rx="14" fill="#05070d" stroke="#38bdf8" stroke-opacity="0.25"/>
  <text x="904" y="505" font-family="monospace" font-size="12" fill="#8a99b3">Conceptual illustration</text>
</svg>
