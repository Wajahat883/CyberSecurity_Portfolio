<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Shield mark -->
  <g transform="translate(96, 232)">
    <rect x="-16" y="-16" width="132" height="132" rx="26" fill="#05070d" stroke="#22d3ee" stroke-opacity="0.25"/>
    <path d="M50 2 L92 18 V52 C92 80 74 96 50 106 C26 96 8 80 8 52 V18 Z"
          fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M32 52 l12 12 l22 -26" fill="none" stroke="url(#accent)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="96" y="420" font-family="Inter, Arial, sans-serif" font-size="28"
        fill="#22d3ee" letter-spacing="5" font-weight="600">CYBERSECURITY PENETRATION TESTER</text>
  <text x="94" y="490" font-family="Inter, Arial, sans-serif" font-size="66"
        fill="#e6edf6" font-weight="700">Muhammad Wajahat</text>
  <text x="96" y="538" font-family="Inter, Arial, sans-serif" font-size="27"
